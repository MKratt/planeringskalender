<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Planeringskalender</title>
  
  <!-- PWA Inställningar -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalender">

  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --header-bg: #2c2c2e;
      --accent-blue: #0a84ff;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background-color: rgba(28, 28, 30, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      flex-grow: 1;
    }

    .add-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    /* Segmented Picker */
    .picker-container {
      padding: 8px 16px;
    }

    .segmented-control {
      display: flex;
      background-color: rgba(118, 118, 128, 0.24);
      border-radius: 9px;
      padding: 2px;
    }

    .segment-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      padding: 6px 0;
      font-size: 13px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segment-btn.active {
      background-color: #636366;
      font-weight: 600;
    }

    /* Period Header */
    .period-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: rgba(44, 44, 46, 0.8);
      font-size: 15px;
      font-weight: 600;
    }

    .nav-arrow {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 18px;
      cursor: pointer;
    }

    /* Main Grid List */
    .calendar-container {
      flex: 1;
      overflow-y: auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .day-row {
      display: flex;
      height: 44px;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
    }

    .day-info {
      width: 75px;
      min-width: 75px;
      display: flex;
      align-items: center;
      padding-left: 8px;
      gap: 4px;
      font-size: 13px;
      border-right: 0.5px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0, 0, 0, 0.2);
    }

    .day-info.weekend {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .day-num {
      font-weight: 700;
      font-family: monospace;
      width: 18px;
    }

    .day-name {
      font-size: 10px;
      color: var(--text-sub);
      width: 18px;
    }

    .week-tag {
      font-size: 8px;
      font-weight: 700;
      color: var(--accent-blue);
      background-color: rgba(10, 132, 255, 0.2);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* Tracks */
    .tracks-container {
      display: flex;
      flex: 1;
    }

    .track-cell {
      flex: 1;
      border-right: 0.5px solid rgba(255, 255, 255, 0.08);
      padding: 2px;
      position: relative;
    }

    .track-cell:last-child {
      border-right: none;
    }

    .event-block {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      box-sizing: border-border-box;
    }

    .event-block.note {
      border: 1px dashed rgba(255, 255, 255, 0.4);
      background-color: rgba(128, 128, 128, 0.25) !important;
    }

    .event-title {
      font-weight: 700;
      line-height: 1.1;
    }

    .event-sub {
      font-size: 8px;
      opacity: 0.85;
      line-height: 1;
    }

    /* Modal / Form Sheet */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-card {
      background-color: #1c1c1e;
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-weight: 700; font-size: 17px; }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 15px;
    }

    .color-picker-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .color-opt {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-opt.selected {
      border-color: white;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary { background-color: var(--accent-blue); color: white; }
    .btn-cancel { background-color: rgba(255, 255, 255, 0.1); color: white; }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <div class="toolbar">
    <div style="width: 24px;"></div>
    <div class="app-title">Planeringskalender</div>
    <button class="add-btn" onclick="openModal()">⊕</button>
  </div>

  <!-- View Picker -->
  <div class="picker-container">
    <div class="segmented-control">
      <button class="segment-btn" onclick="setSpan('week')">Vecka</button>
      <button class="segment-btn active" onclick="setSpan('month')">Månad</button>
      <button class="segment-btn" onclick="setSpan('3month')">3 Månader</button>
    </div>
  </div>

  <!-- Period Navigation -->
  <div class="period-header">
    <button class="nav-arrow" onclick="navigatePeriod(-1)">◀</button>
    <span id="periodLabel">September 2026</span>
    <button class="nav-arrow" onclick="navigatePeriod(1)">▶</button>
  </div>

  <!-- Grid Rows -->
  <div class="calendar-container" id="calendarGrid"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Nytt Projekt</span>
        <button style="background:none; border:none; color:var(--text-sub); font-size:18px;" onclick="closeModal()">✕</button>
      </div>

      <div class="form-group">
        <label>Titel</label>
        <input type="text" id="eventTitleInput" class="form-control" placeholder="Projektnamn / Anteckning">
      </div>

      <div class="form-group">
        <label>Info / Underrad</label>
        <textarea id="eventInfoInput" class="form-control" rows="2" placeholder="Repetitioner, flygtider m.m."></textarea>
      </div>

      <div class="form-group">
        <label>Färg & Typ</label>
        <div class="color-picker-row" id="colorPickerRow"></div>
      </div>

      <div class="form-group">
        <label>Spår / Stapel</label>
        <select id="trackSelect" class="form-control">
          <option value="0">Stapel 1</option>
          <option value="1">Stapel 2</option>
          <option value="2">Stapel 3</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeModal()">Avbryt</button>
        <button class="btn btn-primary" onclick="saveEvent()">Spara</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let currentDate = new Date(2026, 8, 1); // Sept 2026
    let currentSpan = 'month';
    let selectedColor = '#f4364c';
    let isNoteMode = false;

    const PRESET_COLORS = [
      { name: 'Röd', hex: '#f4364c' },
      { name: 'Grön', hex: '#34a853' },
      { name: 'Gul', hex: '#fbbc04' },
      { name: 'Blå', hex: '#4285f4' },
      { name: 'Lila', hex: '#ab47bc' },
      { name: 'Orange', hex: '#ff9500' }
    ];

    let events = [
      { id: '1', title: 'Chicago', info: 'Rep 10-18', color: '#fbbc04', start: '2026-09-10', end: '2026-09-17', track: 0, isNote: false },
      { id: '2', title: 'Flyg SK1420', info: 'Avgång 08:45', color: 'gray', start: '2026-09-12', end: '2026-09-12', track: 2, isNote: true }
    ];

    // Initialize
    function init() {
      renderColorPicker();
      renderCalendar();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    }

    function setSpan(span) {
      currentSpan = span;
      document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCalendar();
    }

    function navigatePeriod(direction) {
      if (currentSpan === 'month') {
        currentDate.setMonth(currentDate.getMonth() + direction);
      } else if (currentSpan === 'week') {
        currentDate.setDate(currentDate.getDate() + (direction * 7));
      } else {
        currentDate.setMonth(currentDate.getMonth() + (direction * 3));
      }
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const monthNames = ["Januari", "Februari", "Mars", "April", "Maj", "Juni", "Juli", "Augusti", "September", "Oktober", "November", "December"];
      document.getElementById('periodLabel').innerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const dayNames = ["sö", "må", "ti", "on", "to", "fr", "lö"];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dateObj.getDay();
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isMonday = (dayOfWeek === 1);

        let rowHTML = `
          <div class="day-row">
            <div class="day-info ${isWeekend ? 'weekend' : ''}">
              <span class="day-num">${day}</span>
              <span class="day-name">${dayNames[dayOfWeek]}</span>
              ${isMonday ? `<span class="week-tag">v.${getWeekNumber(dateObj)}</span>` : ''}
            </div>
            <div class="tracks-container">
        `;

        for (let track = 0; track < 3; track++) {
          const ev = events.find(e => e.track === track && e.start <= dateStr && e.end >= dateStr);
          
          rowHTML += `<div class="track-cell">`;
          if (ev) {
            if (ev.start === dateStr) {
              rowHTML += `
                <div class="event-block ${ev.isNote ? 'note' : ''}" style="background-color: ${ev.color};">
                  <div class="event-title">${ev.title}</div>
                  ${ev.info ? `<div class="event-sub">${ev.info}</div>` : ''}
                </div>
              `;
            } else {
              rowHTML += `<div class="event-block ${ev.isNote ? 'note' : ''}" style="background-color: ${ev.color}; opacity:0.8;"></div>`;
            }
          }
          rowHTML += `</div>`;
        }

        rowHTML += `</div></div>`;
        grid.innerHTML += rowHTML;
      }
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    }

    // Modal logic
    function renderColorPicker() {
      const row = document.getElementById('colorPickerRow');
      row.innerHTML = `<div class="color-opt" style="border:1px dashed white; background:#333;" onclick="selectColor('note')"></div>`;
      PRESET_COLORS.forEach(c => {
        row.innerHTML += `<div class="color-opt" style="background:${c.hex};" onclick="selectColor('${c.hex}')"></div>`;
      });
    }

    function selectColor(hex) {
      if (hex === 'note') {
        isNoteMode = true;
        selectedColor = 'gray';
      } else {
        isNoteMode = false;
        selectedColor = hex;
      }
    }

    function openModal() {
      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
    }

    function saveEvent() {
      const title = document.getElementById('eventTitleInput').value;
      const info = document.getElementById('eventInfoInput').value;
      const track = parseInt(document.getElementById('trackSelect').value);

      if (!title) return;

      const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-15`;

      events.push({
        id: Date.now().toString(),
        title: title,
        info: info,
        color: selectedColor,
        start: dateStr,
        end: dateStr,
        track: track,
        isNote: isNoteMode
      });

      closeModal();
      renderCalendar();
    }

    init();
  </script>
</body>
</html>
