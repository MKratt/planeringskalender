<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Planeringskalender</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalender">

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #1c1c1e;
      --header-bg: #2c2c2e;
      --accent-blue: #0a84ff;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #050b14 0%, #0e1117 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background-color: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      flex-grow: 1;
    }

    .add-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    /* Segmented Picker */
    .picker-container {
      padding: 8px 16px;
    }

    .segmented-control {
      display: flex;
      background-color: rgba(118, 118, 128, 0.24);
      border-radius: 9px;
      padding: 2px;
    }

    .segment-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      padding: 6px 0;
      font-size: 13px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
    }

    .segment-btn.active {
      background-color: #636366;
      font-weight: 600;
    }

    /* Period Header */
    .period-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: rgba(44, 44, 46, 0.85);
      font-size: 15px;
      font-weight: 600;
    }

    .nav-arrow {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 18px;
      cursor: pointer;
    }

    /* Grid Container */
    .calendar-container {
      flex: 1;
      overflow-y: auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .day-row {
      display: flex;
      height: 38px;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
    }

    .day-info {
      width: 84px;
      min-width: 84px;
      display: flex;
      align-items: center;
      padding-left: 6px;
      gap: 4px;
      font-size: 13px;
      border-right: 0.5px solid rgba(255, 255, 255, 0.12);
      background-color: rgba(0, 0, 0, 0.2);
    }

    .day-info.weekend {
      background-color: rgba(255, 255, 255, 0.06);
    }

    .day-num {
      font-weight: 700;
      font-family: monospace;
      width: 20px;
      text-align: right;
    }

    .day-name {
      font-size: 10px;
      color: var(--text-sub);
      width: 20px;
    }

    .week-tag {
      font-size: 9px;
      font-weight: 700;
      color: var(--accent-blue);
      background-color: rgba(10, 132, 255, 0.18);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* Tracks Grid */
    .tracks-container {
      display: flex;
      flex: 1;
    }

    .track-cell {
      flex: 1;
      border-right: 0.5px solid rgba(255, 255, 255, 0.08);
      padding: 0;
      position: relative;
    }

    .track-cell:last-child {
      border-right: none;
    }

    /* Seamless Event Block Styles */
    .event-block {
      width: 100%;
      height: 100%;
      padding: 2px 6px;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      box-sizing: border-box;
      cursor: pointer;
    }

    .event-block.single { border-radius: 4px; }
    .event-block.start { border-radius: 4px 4px 0 0; }
    .event-block.middle { border-radius: 0; }
    .event-block.end { border-radius: 0 0 4px 4px; }

    .event-block.low-priority {
      opacity: 0.6;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.2) 4px, rgba(255,255,255,0.2) 8px);
    }

    .event-block.note {
      border: 1px dashed rgba(255, 255, 255, 0.4);
      background-color: rgba(128, 128, 128, 0.3) !important;
    }

    .event-title {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .event-sub {
      font-size: 8.5px;
      opacity: 0.85;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-card {
      background-color: #1c1c1e;
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-weight: 700; font-size: 17px; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 15px;
    }

    .color-picker-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0;
      align-items: center;
    }

    .color-opt {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-opt.selected { border-color: white; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary { background-color: var(--accent-blue); color: white; }
    .btn-cancel { background-color: rgba(255, 255, 255, 0.1); color: white; }
    .btn-danger { background-color: rgba(255, 69, 58, 0.2); color: #ff453a; margin-top: 10px; width: 100%; }
    .btn-dup { background-color: rgba(255, 255, 255, 0.15); color: white; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="toolbar">
    <div style="width: 26px;"></div>
    <div class="app-title">Planeringskalender</div>
    <button class="add-btn" onclick="openModalForAdd()">⊕</button>
  </div>

  <!-- Span Picker -->
  <div class="picker-container">
    <div class="segmented-control">
      <button class="segment-btn" onclick="setSpan('week', this)">Vecka</button>
      <button class="segment-btn active" onclick="setSpan('month', this)">Månad</button>
      <button class="segment-btn" onclick="setSpan('3month', this)">3 Månader</button>
    </div>
  </div>

  <!-- Period Navigation -->
  <div class="period-header">
    <button class="nav-arrow" onclick="navigatePeriod(-1)">◀</button>
    <span id="periodLabel">September 2026</span>
    <button class="nav-arrow" onclick="navigatePeriod(1)">▶</button>
  </div>

  <!-- Calendar Grid -->
  <div class="calendar-container" id="calendarGrid"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Nytt Projekt</span>
        <button style="background:none; border:none; color:var(--text-sub); font-size:18px;" onclick="closeModal()">✕</button>
      </div>

      <div class="form-group">
        <label>Titel</label>
        <input type="text" id="eventTitleInput" class="form-control" placeholder="Projektnamn / Anteckning">
      </div>

      <div class="form-group">
        <label>Info / Underrad (Retur för fler rader)</label>
        <textarea id="eventInfoInput" class="form-control" rows="3" placeholder="Repetitioner, flygtider m.m."></textarea>
      </div>

      <div class="form-group">
        <label>Typ & Färg</label>
        <div class="color-picker-row" id="colorPickerRow"></div>
      </div>

      <div class="form-group">
        <label>Startdatum & Slutdatum</label>
        <div style="display:flex; gap:8px;">
          <input type="date" id="startDateInput" class="form-control">
          <input type="date" id="endDateInput" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Spår / Stapel</label>
        <select id="trackSelect" class="form-control">
          <option value="0">Stapel 1</option>
          <option value="1">Stapel 2</option>
          <option value="2">Stapel 3</option>
        </select>
      </div>

      <div class="form-group" style="display:flex; align-items:center; justify-content:space-between;">
        <label style="margin:0;">Låg prioritet</label>
        <input type="checkbox" id="lowPriorityInput" style="transform: scale(1.3);">
      </div>

      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeModal()">Avbryt</button>
        <button class="btn btn-primary" onclick="saveEvent()">Spara</button>
      </div>

      <div id="editExtraBtns" style="display:none;">
        <button class="btn btn-dup" onclick="duplicateCurrentEvent()">Duplicera Projekt</button>
        <button class="btn btn-danger" onclick="deleteCurrentEvent()">Ta bort Projekt</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date(2026, 8, 1);
    let currentSpan = 'month';
    let selectedColor = '#f4364c';
    let isNoteMode = false;
    let editingEventId = null;

    const PRESET_COLORS = [
      { name: 'Röd', hex: '#f4364c' },
      { name: 'Grön', hex: '#34a853' },
      { name: 'Gul', hex: '#fbbc04' },
      { name: 'Blå', hex: '#4285f4' },
      { name: 'Lila', hex: '#ab47bc' },
      { name: 'Orange', hex: '#ff9500' },
      { name: 'Rosa', hex: '#ff2d55' }
    ];

    let events = [
      { id: '1', title: 'Chicago', info: 'Rep 10-18', color: '#fbbc04', start: '2026-09-10', end: '2026-09-17', track: 0, isLowPriority: false, isNote: false },
      { id: '2', title: 'Flyg SK1420', info: 'Avgång 08:45 Arlanda', color: 'gray', start: '2026-09-12', end: '2026-09-12', track: 2, isLowPriority: false, isNote: true }
    ];

    function init() {
      renderColorPicker();
      renderCalendar();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    }

    function setSpan(span, btn) {
      currentSpan = span;
      document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCalendar();
    }

    function navigatePeriod(direction) {
      if (currentSpan === 'month') {
        currentDate.setMonth(currentDate.getMonth() + direction);
      } else if (currentSpan === 'week') {
        currentDate.setDate(currentDate.getDate() + (direction * 7));
      } else {
        currentDate.setMonth(currentDate.getMonth() + (direction * 3));
      }
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const monthNames = ["Januari", "Februari", "Mars", "April", "Maj", "Juni", "Juli", "Augusti", "September", "Oktober", "November", "December"];
      document.getElementById('periodLabel').innerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const dayNames = ["sö", "må", "ti", "on", "to", "fr", "lö"];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dateObj.getDay();
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isMonday = (dayOfWeek === 1);

        let rowHTML = `
          <div class="day-row">
            <div class="day-info ${isWeekend ? 'weekend' : ''}">
              <span class="day-num">${day}</span>
              <span class="day-name">${dayNames[dayOfWeek]}</span>
              ${isMonday ? `<span class="week-tag">v.${getWeekNumber(dateObj)}</span>` : ''}
            </div>
            <div class="tracks-container">
        `;

        for (let track = 0; track < 3; track++) {
          const ev = events.find(e => e.track === track && e.start <= dateStr && e.end >= dateStr);
          
          rowHTML += `<div class="track-cell">`;
          if (ev) {
            let posClass = 'middle';
            if (ev.start === dateStr && ev.end === dateStr) posClass = 'single';
            else if (ev.start === dateStr) posClass = 'start';
            else if (ev.end === dateStr) posClass = 'end';

            rowHTML += `
              <div class="event-block ${posClass} ${ev.isLowPriority ? 'low-priority' : ''} ${ev.isNote ? 'note' : ''}" 
                   style="background-color: ${ev.isNote ? 'transparent' : ev.color};"
                   onclick="openModalForEdit('${ev.id}')">
                ${(posClass === 'start' || posClass === 'single') ? `
                  <div class="event-title">${ev.title}</div>${ev.info ? `<div class="event-sub">${ev.info}</div>` : ''}
                ` : ''}
              </div>
            `;
          }
          rowHTML += `</div>`;
        }

        rowHTML += `</div></div>`;
        grid.innerHTML += rowHTML;
      }
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    }

    function renderColorPicker() {
      const row = document.getElementById('colorPickerRow');
      row.innerHTML = `<button type="button" style="background:#333; border:1px dashed white; color:white; font-size:10px; padding:6px; border-radius:6px;" onclick="selectColor('note', this)">Ingen färg / Note</button>`;
      PRESET_COLORS.forEach(c => {
        row.innerHTML += `<div class="color-opt" style="background:${c.hex};" onclick="selectColor('${c.hex}', this)"></div>`;
      });
    }

    function selectColor(hex, el) {
      document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('selected'));
      if (el && el.classList) el.classList.add('selected');

      if (hex === 'note') {
        isNoteMode = true;
        selectedColor = 'gray';
      } else {
        isNoteMode = false;
        selectedColor = hex;
      }
    }

    function openModalForAdd() {
      editingEventId = null;
      document.getElementById('modalTitle').innerText = 'Nytt Projekt';
      document.getElementById('eventTitleInput').value = '';
      document.getElementById('eventInfoInput').value = '';
      document.getElementById('lowPriorityInput').checked = false;
      document.getElementById('editExtraBtns').style.display = 'none';

      const defaultDate = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-10`;
      document.getElementById('startDateInput').value = defaultDate;
      document.getElementById('endDateInput').value = defaultDate;

      document.getElementById('eventModal').style.display = 'flex';
    }

    function openModalForEdit(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;

      editingEventId = id;
      document.getElementById('modalTitle').innerText = ev.isNote ? 'Redigera Note' : 'Redigera Projekt';
      document.getElementById('eventTitleInput').value = ev.title;
      document.getElementById('eventInfoInput').value = ev.info;
      document.getElementById('startDateInput').value = ev.start;
      document.getElementById('endDateInput').value = ev.end;
      document.getElementById('trackSelect').value = ev.track;
      document.getElementById('lowPriorityInput').checked = ev.isLowPriority;
      
      selectColor(ev.isNote ? 'note' : ev.color);
      document.getElementById('editExtraBtns').style.display = 'block';

      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
    }

    function saveEvent() {
      const title = document.getElementById('eventTitleInput').value;
      const info = document.getElementById('eventInfoInput').value;
      const start = document.getElementById('startDateInput').value;
      const end = document.getElementById('endDateInput').value;
      const track = parseInt(document.getElementById('trackSelect').value);
      const isLowPriority = document.getElementById('lowPriorityInput').checked;

      if (!title || !start || !end) return;

      if (editingEventId) {
        const index = events.findIndex(e => e.id === editingEventId);
        if (index !== -1) {
          events[index] = { id: editingEventId, title, info, start, end, track, color: selectedColor, isLowPriority, isNote: isNoteMode };
        }
      } else {
        events.push({
          id: Date.now().toString(),
          title, info, start, end, track,
          color: selectedColor,
          isLowPriority,
          isNote: isNoteMode
        });
      }

      closeModal();
      renderCalendar();
    }

    function duplicateCurrentEvent() {
      if (!editingEventId) return;
      const ev = events.find(e => e.id === editingEventId);
      if (ev) {
        events.push({
          ...ev,
          id: Date.now().toString()
        });
      }
      closeModal();
      renderCalendar();
    }

    function deleteCurrentEvent() {
      if (!editingEventId) return;
      events = events.filter(e => e.id !== editingEventId);
      closeModal();
      renderCalendar();
    }

    init();
  </script>
</body>
</html>
